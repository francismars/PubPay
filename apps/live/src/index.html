<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Content-Security-Policy: scripts are bundled (no CDN hosts). 'unsafe-inline' styles are required by
         style-loader/React inline styles; dev-only localhost entries cover webpack HMR and the local API. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' https: data: blob:;
        media-src 'self' https: blob:;
        connect-src <%= cspConnectSrc %>;
        frame-src 'self';
        worker-src 'self' blob:;
        manifest-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PUBPAY.me - Live Events</title>
