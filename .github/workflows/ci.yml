name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export types from dist/; build them before tsc.
      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm --filter @pubpay/pubpay test

      - name: Build
        run: pnpm build:prod

      - name: Lint
        run: pnpm lint

      # Unused exports/deps still being cleaned up.
      - name: Knip (non-blocking)
        continue-on-error: true
        run: pnpm knip
